name: Task
description: A feature, improvement, refactor, docs change or chore
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should change and why. Keep it narrow; one piece of work per issue.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to be done.
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: Relevant files
      description: Optional. Likely files or modules.
  - type: input
    id: depends
    attributes:
      label: Blocked by
      description: Optional. Issue numbers, e.g. #12.
