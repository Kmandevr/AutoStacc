# Publishes the site to Cloudflare Pages on every push to main. Only the site files are uploaded, not docs/ or .claude/.
# Needs repo secrets CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: autostacc
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir dist
          cp *.html dist/
          cp -r css js data dist/
          find dist -name .purpose -delete
      - name: Create the Pages project if it doesn't exist
        run: |
          npx --yes wrangler@4 pages project list | grep -qw "$PROJECT" ||
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main
