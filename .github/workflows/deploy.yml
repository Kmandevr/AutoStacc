# Publishes the site to Cloudflare Pages on every push to main, after regenerating the SEO files and running the SEO
# and unit tests (a failing test stops the deploy). Only the public site (scripts/dist.js) and, when enabled, the
# store API (functions/ + server/) are uploaded; never docs/, scripts/, test/ or .claude/.
#
# The store is off until the repository variable STORE_ENABLED is "true" (Settings → Secrets and variables → Actions →
# Variables). Off: the deploy is the plain static site, as before. On: scripts/cloudflare.js creates the D1 database
# and R2 buckets if missing, applies migrations, syncs the catalog and copies the store secrets below into Cloudflare.
#
# Secrets: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit; with the store also D1: Edit and Workers R2 Storage: Edit),
# CLOUDFLARE_ACCOUNT_ID, and for the store BETTER_AUTH_SECRET, DOWNLOAD_SIGNING_SECRET, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, BREVO_API_KEY, ADMIN_EMAILS; optional for creators' sales and payouts: STRIPE_MARKETPLACE_KEY,
# STRIPE_MARKETPLACE_WEBHOOK_SECRET, PLATFORM_COUNTRY (docs/payouts-setup.md); optional for newsletters: BREVO_NEWSLETTER_LISTS, BREVO_NEWS_LIST. Full list and how to make each: docs/store-setup.md.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy secrets can live in this Environment, which only main may use (docs/development.md, "Security tooling").
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: autostacc
      STORE_ENABLED: ${{ vars.STORE_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install (Wrangler for the deploy, Better Auth and Stripe for the store API)
        # Dependencies' install scripts never see the Cloudflare token.
        env:
          CLOUDFLARE_API_TOKEN: ""
        run: npm ci
      - name: Committed pages, heads, sitemap and catalog match data/ (so the live site is what the repo shows)
        run: node scripts/build.js --check
      - name: SEO regression tests
        run: node scripts/seo-test.js
      - name: Store unit tests
        run: npm test
      - name: Collect site files
        run: node scripts/dist.js
      - name: Create the Pages project if it doesn't exist
        run: |
          npx wrangler pages project list | grep -qw "$PROJECT" ||
            npx wrangler pages project create "$PROJECT" --production-branch main
      - name: Store resources, migrations, catalog and secrets
        if: env.STORE_ENABLED == 'true'
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DOWNLOAD_SIGNING_SECRET: ${{ secrets.DOWNLOAD_SIGNING_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          STRIPE_MARKETPLACE_KEY: ${{ secrets.STRIPE_MARKETPLACE_KEY }}
          STRIPE_MARKETPLACE_WEBHOOK_SECRET: ${{ secrets.STRIPE_MARKETPLACE_WEBHOOK_SECRET }}
          PLATFORM_COUNTRY: ${{ secrets.PLATFORM_COUNTRY }}
          BREVO_NEWSLETTER_LISTS: ${{ secrets.BREVO_NEWSLETTER_LISTS }}
          BREVO_NEWS_LIST: ${{ secrets.BREVO_NEWS_LIST }}
          SWEEP_TOKEN: ${{ secrets.SWEEP_TOKEN }}
        run: node scripts/cloudflare.js store
      - name: Static site only (store not enabled)
        if: env.STORE_ENABLED != 'true'
        run: node scripts/cloudflare.js static
      - name: Deploy
        run: npx wrangler pages deploy dist --project-name "$PROJECT" --branch main
      - name: Check the live site
        run: node scripts/deploy-check.js https://autostacc.com $([ "$STORE_ENABLED" = true ] && echo --store)
