# Publishes the site to Cloudflare Pages on every push to main, after regenerating the SEO files and running the SEO tests
# (a failing test stops the deploy). Only the public site is uploaded, not docs/, scripts/ or .claude/.
# Needs repo secrets CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: autostacc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Committed pages, heads and sitemap match data/ (so the live site is what the repo shows)
        run: node scripts/build.js --check
      - name: SEO regression tests
        run: node scripts/seo-test.js
      - name: Collect site files
        run: |
          mkdir dist
          cp *.html dist/
          cp -r css js data img dist/
          # generated pages (scripts/build.js); a folder is absent when its data list is empty
          for d in music shop news; do [ -d "$d" ] && cp -r "$d" dist/; done
          cp _redirects _headers robots.txt sitemap.xml dist/
          # dotfiles and editor-only type config (js/jsconfig.json, js/globals.d.ts) stay out of the public site
          find dist \( -name .purpose -o -name '*.d.ts' -o -name jsconfig.json \) -delete
      - name: Create the Pages project if it doesn't exist
        run: |
          npx --yes wrangler@4 pages project list | grep -qw "$PROJECT" ||
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main
