# Search-visibility guard on every pull request: generated files must match data/, the SEO regression tests must pass,
# and the site is checked in a real browser (rendered <head>, structured data, crawl for orphan pages). The docs check
# fails on broken facts in the notes and warns about notes whose covered code changed in this PR. Not again on the push
# to main that merges a PR: the deploy runs the build check and the SEO tests itself before publishing. The quick checks
# share one job (each job is billed at least a minute; CI minutes are limited, docs/decisions.md).
name: SEO and site checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated files are up to date (else run node scripts/build.js and commit)
        run: node scripts/build.js --check
      - name: SEO regression tests
        run: node scripts/seo-test.js
      # A note (or the README) whose code changed in this PR must change too (--strict); Dependabot's updates are exempt.
      - name: Docs match the repository and were updated with the code they describe
        env:
          STRICT: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && '--strict' || '' }}
        run: |
          node scripts/docs-test.js $STRICT | tee docs-test.txt; code=${PIPESTATUS[0]}
          sed -n 's/^WARN \(.*\)$/::warning title=docs::\1/p' docs-test.txt
          exit $code
  # Skipped when it already passed on exactly these files (the site and its checker, by content; notes aside): a marker
  # in the Actions cache, as in store.yml.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=$({ git ls-files -s -- . ':!docs' ':!.claude' ':!*.md'; git ls-files -s .claude/skills/verify-site; } | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - id: passed
        uses: actions/cache/restore@v4
        with:
          path: .ci-passed
          key: site-browser-passed-${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.passed.outputs.cache-hit == 'true'
        run: echo "Already passed on these files; not checked again."
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright with Chromium
        if: steps.passed.outputs.cache-hit != 'true'
        run: npm install -g playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Browser checks (verify-site)
        if: steps.passed.outputs.cache-hit != 'true'
        run: NODE_PATH=$(npm root -g) node .claude/skills/verify-site/check.js && mkdir -p .ci-passed && echo "${{ github.sha }}" > .ci-passed/sha
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-passed
          key: site-browser-passed-${{ steps.key.outputs.key }}
