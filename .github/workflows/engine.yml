# The processing engine (engine/, docs/engine.md) and its Worker (workers/engine/). On every change to them: Rust
# format, lints (native and WebAssembly), tests, a parity check that the native and WebAssembly builds give identical
# results on a generated pack, and a build of the Container image with a health check, on each pull request. On the
# push to main that merges it, only the deploy of the engine Worker and its Container runs (the PR already passed the
# checks; CI minutes are limited, docs/decisions.md); by hand, the checks and then the deploy. The Container runs
# nothing until a job is queued.
#
# Deploy secrets: CLOUDFLARE_API_TOKEN (also needs Workers Scripts: Edit, Queues: Edit, Containers: Edit, Account Settings: Read),
# CLOUDFLARE_ACCOUNT_ID, optional ENGINE_ADMIN_TOKEN (at least 32 characters; turns on the smoke-test routes) and
# SWEEP_TOKEN (the same value the site's deploy gives the store; turns on the daily retention sweep). The engine
# needs no storage credentials: its Worker answers its reads from the R2 binding. Without the API token the deploy is skipped.
name: Engine
on:
  push:
    branches: [main]
    paths: ["engine/**", "workers/engine/**", "js/engine/**", "test/bench/**", "test/mock-engine/**", "test/unit/engine-worker.test.js", "test/unit/mock-engine.test.js", "scripts/engine-*.js", "scripts/lib/json-schema.js", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "workers/engine/**", "js/engine/**", "test/bench/**", "test/mock-engine/**", "test/unit/engine-worker.test.js", "test/unit/mock-engine.test.js", "scripts/engine-*.js", "scripts/lib/json-schema.js", ".github/workflows/engine.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      # Skipped when it already passed on exactly these files (everything this workflow watches, by content): a marker
      # in the Actions cache, as in store.yml.
      - id: key
        working-directory: .
        run: echo "key=$(git ls-files -s -- engine workers/engine js/engine test/bench test/mock-engine test/unit/engine-worker.test.js test/unit/mock-engine.test.js 'scripts/engine-*.js' scripts/lib/json-schema.js .github/workflows/engine.yml | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - id: passed
        uses: actions/cache/restore@v6
        with:
          path: .ci-passed
          key: engine-test-passed-${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.passed.outputs.cache-hit == 'true'
        working-directory: .
        run: echo "Already passed on these files; not checked again."
      - name: Rust with the WebAssembly target
        if: steps.passed.outputs.cache-hit != 'true'
        run: rustup update stable --no-self-update && rustup default stable && rustup target add wasm32-unknown-unknown && rustup component add rustfmt clippy
      - uses: actions/cache@v6
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: engine-${{ hashFiles('engine/Cargo.lock') }}
      - name: Format
        if: steps.passed.outputs.cache-hit != 'true'
        run: cargo fmt --check
      - name: Lints (native and WebAssembly)
        if: steps.passed.outputs.cache-hit != 'true'
        run: cargo clippy --all-targets -- -D warnings && cargo clippy --release --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        if: steps.passed.outputs.cache-hit != 'true'
        run: cargo test
      - name: Release builds (native binary and WebAssembly)
        if: steps.passed.outputs.cache-hit != 'true'
        run: cargo build --release && cargo build --release --lib --target wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          node-version: 22
      - name: Native and WebAssembly give identical results on a generated pack
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: .
        run: node test/bench/make-pack.js --mb 48 && node test/bench/engine-bench.js test/bench/out/pack-48mb.zip
      - name: Contract conformance (native and WebAssembly builds)
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: .
        run: node scripts/engine-conformance.js && node scripts/engine-conformance.js --wasm engine/target/wasm32-unknown-unknown/release/autostacc_engine.wasm
      - name: The site's copy of the WebAssembly build (js/engine/, run node scripts/engine-wasm.js after engine changes)
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          node scripts/engine-conformance.js --wasm js/engine/autostacc_engine.wasm
          node -e '
            const fs = require("fs");
            const want = /^version = "([^"]+)"/m.exec(fs.readFileSync("engine/Cargo.toml", "utf8"))[1];
            require("./js/engine/engine-wasm.js").create(fs.readFileSync("js/engine/autostacc_engine.wasm")).then((e) => {
              const v = e.version().engineVersion;
              if (v !== want) { console.error(`js/engine/autostacc_engine.wasm is engine ${v}, not ${want}: run node scripts/engine-wasm.js`); process.exit(1); }
              console.log(`js/engine/autostacc_engine.wasm is engine ${v}`);
            });'
      - name: Engine Worker and mock engine unit tests
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: .
        run: node --test test/unit/engine-worker.test.js test/unit/mock-engine.test.js
      - name: Passed on these files (a marker, so the same files aren't checked again)
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: .
        run: mkdir -p .ci-passed && echo "${{ github.sha }}" > .ci-passed/sha
      - uses: actions/cache/save@v6
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          path: .ci-passed
          key: engine-test-passed-${{ steps.key.outputs.key }}

  image:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Skipped when it already passed on exactly these files (everything this workflow watches, by content): a marker
      # in the Actions cache, as in store.yml.
      - id: key
        working-directory: .
        run: echo "key=$(git ls-files -s -- engine workers/engine js/engine test/bench test/mock-engine test/unit/engine-worker.test.js test/unit/mock-engine.test.js 'scripts/engine-*.js' scripts/lib/json-schema.js .github/workflows/engine.yml | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - id: passed
        uses: actions/cache/restore@v6
        with:
          path: .ci-passed
          key: engine-image-passed-${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.passed.outputs.cache-hit == 'true'
        working-directory: .
        run: echo "Already passed on these files; not checked again."
      - name: Build the Container image
        if: steps.passed.outputs.cache-hit != 'true'
        run: docker build -t autostacc-engine:ci engine
      - name: It starts and answers its health check
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          docker run -d --name engine -p 8080:8080 autostacc-engine:ci
          for i in $(seq 50); do curl -sf localhost:8080/healthz && exit 0; sleep 0.2; done
          docker logs engine; exit 1
      - name: Passed on these files (a marker, so the same files aren't checked again)
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: .
        run: mkdir -p .ci-passed && echo "${{ github.sha }}" > .ci-passed/sha
      - uses: actions/cache/save@v6
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          path: .ci-passed
          key: engine-image-passed-${{ steps.key.outputs.key }}

  deploy:
    needs: [test, image]
    # Skipped checks (on the push to main) don't block it; failed or cancelled ones do.
    if: ${{ !failure() && !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: engine-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.ENGINE_ADMIN_TOKEN }}
      SWEEP_TOKEN: ${{ secrets.SWEEP_TOKEN }}
    defaults:
      run:
        working-directory: workers/engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Skip without the Cloudflare API token
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Engine not deployed: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/engine.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install (the Containers library and Wrangler)
        if: steps.ready.outputs.go == 'true'
        # Dependencies' install scripts never see the tokens.
        env:
          CLOUDFLARE_API_TOKEN: ""
          ADMIN_TOKEN: ""
          SWEEP_TOKEN: ""
        run: npm ci && npm i --no-save wrangler@4.148.0
      - name: Containers access (what Cloudflare answers before the image is built)
        if: steps.ready.outputs.go == 'true'
        run: |
          acct=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          code=$(curl -s -o /tmp/cme.json -w '%{http_code}' -H "$auth" "$acct/containers/me")
          echo "containers/me: HTTP $code"; jq -c '{success, errors, messages}' /tmp/cme.json 2>/dev/null || head -c 600 /tmp/cme.json; echo
          if [ "$code" != 200 ]; then
            echo "::error::Cloudflare refuses Containers for this token or account (HTTP $code above). Check the token has Containers → Edit and that Containers is enabled for the account (dashboard → Workers & Pages → Containers)."
            exit 1
          fi
      - name: Queues (created once; existing ones are kept)
        if: steps.ready.outputs.go == 'true'
        run: |
          for q in autostacc-engine-jobs autostacc-engine-jobs-failed; do
            out=$(npx wrangler queues create "$q" 2>&1) && { echo "created $q"; continue; }
            if echo "$out" | grep -qiE "already (exists|taken)"; then echo "$q exists"; continue; fi
            echo "$out"
            if echo "$out" | grep -q "code: 10000"; then echo "::error::The Cloudflare API token can't manage Queues: give it Account → Queues → Edit (docs/engine.md)."; fi
            exit 1
          done
      - name: Deploy the Worker and its Container
        if: steps.ready.outputs.go == 'true'
        run: |
          set -o pipefail
          WRANGLER_LOG=debug npx wrangler deploy 2>&1 | tee /tmp/deploy.log | grep -vE "^\[debug\]|^-- |^[A-Za-z-]+: " || {
            # Cloudflare's answer to the failing request (status and body; the debug log never prints the token).
            grep -iE "containers/|cloudchamber|status: [45][0-9][0-9]|\"(code|message)\"" /tmp/deploy.log | grep -viE "authorization|bearer" | tail -25
            grep -q "No access to the specified resource\|code: 10000" /tmp/deploy.log && echo "::error::The Cloudflare API token can't deploy Workers or Containers: give it Account → Workers Scripts → Edit and Containers → Edit (docs/engine.md)."
            grep -q "containers/me" /tmp/deploy.log && echo "::error::Cloudflare refused the Containers setup (containers/me): the token needs Containers → Edit, and the account needs Workers Paid with Containers enabled (docs/engine.md)."
            exit 1
          }
      - name: Secrets
        if: steps.ready.outputs.go == 'true'
        run: |
          # Storage keys from the earlier design: the engine no longer has any.
          for old in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do npx wrangler secret delete "$old" >/dev/null 2>&1 || true; done
          if [ -n "$ADMIN_TOKEN" ]; then printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ENGINE_ADMIN_TOKEN; fi
          if [ -n "$SWEEP_TOKEN" ]; then printf '%s' "$SWEEP_TOKEN" | npx wrangler secret put SWEEP_TOKEN; fi
      - name: Smoke test the deployed engine (needs ENGINE_ADMIN_TOKEN)
        if: steps.ready.outputs.go == 'true' && env.ADMIN_TOKEN != ''
        env:
          ENGINE_ADMIN_TOKEN: ${{ secrets.ENGINE_ADMIN_TOKEN }}
        run: |
          url=$(grep -oE "https://autostacc-engine\.[a-z0-9-]+\.workers\.dev" /tmp/deploy.log | head -1)
          if [ -z "$url" ]; then echo "::warning::No workers.dev address in the deploy output; smoke test skipped."; exit 0; fi
          key="incoming/smoke/pack-basic-${GITHUB_RUN_ID}.zip"
          npx wrangler r2 object put "autostacc-files/$key" --file ../../engine/conformance/cases/pack-basic.zip --remote
          set +e
          node ../../scripts/engine-smoke.js "$url" autostacc-files "$key" pack-basic; code=$?
          npx wrangler r2 object delete "autostacc-files/$key" --remote
          if [ -s /tmp/smoke-job ]; then npx wrangler r2 object delete "autostacc-files/jobs/$(cat /tmp/smoke-job)/result.json" --remote; fi
          exit $code
