# Store tests on every pull request and push to main: unit tests, the API security suite (two local stores: mock
# payments, and Stripe mode against a fake Stripe API with really signed webhooks) and the browser chaos suite.
# Nothing here touches Cloudflare, Stripe or Brevo; everything runs locally in test mode.
name: Store tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # One job per test group, all side by side, so a pull request waits for the slowest group, not the sum. Each group
  # starts its own local store (test/api/*.test.js, test/browser/*.test.js). The job named `store` keeps its name for
  # anything that requires it: unit tests plus the API `accounts` group.
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: API security tests (accounts group)
        run: npm run -s site && node --test --test-reporter=spec test/api/accounts.test.js
  store-api-payments:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API security tests (payments group)
        run: npm run -s site && node --test --test-reporter=spec test/api/payments.test.js
  store-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [flows, layout, features]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright with Chromium
        run: npm install -g playwright@1 && npx playwright install --with-deps chromium
      - name: Browser and chaos tests (${{ matrix.group }} group)
        run: npm run -s site && node --test --test-reporter=spec test/browser/${{ matrix.group }}.test.js
