# Store tests on every pull request: unit tests, the API security suite (two local stores: mock payments, and Stripe
# mode against a fake Stripe API with really signed webhooks) and the browser chaos suite. Nothing here touches
# Cloudflare, Stripe or Brevo; everything runs locally in test mode. Not again on the push to main that merges a PR: the
# PR already ran them, and the deploy runs the unit tests before publishing (CI minutes are limited; docs/decisions.md).
# A newer push to the same PR cancels the run it replaces.
name: Store tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Decides whether the store can be affected: a change to docs or Claude's config only (docs/, .claude/, *.md) can't,
  # so the test jobs are skipped (a skipped job still counts as passed for required checks). Pushes to main always test.
  #
  # It also skips a job that already passed on exactly these files: `key` is a fingerprint of every file the suites can
  # read (all but docs/, .claude/ and *.md, by their content), and each job, once green, leaves a small marker in the
  # Actions cache under it. A push that changes only notes, or a re-run of the same files, finds the marker and doesn't
  # test again (CI minutes are limited; docs/decisions.md). A marker only says "passed"; nothing is restored from it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      store: ${{ steps.diff.outputs.store }}
      key: ${{ steps.key.outputs.key }}
      api_passed: ${{ steps.api.outputs.cache-hit }}
      browser_passed: ${{ steps.browser.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "store=true" >> "$GITHUB_OUTPUT"; exit 0; fi # by hand: always
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          if echo "$changed" | grep -qvE '^(docs/|\.claude/)|\.md$'; then echo "store=true"; else echo "store=false"; fi >> "$GITHUB_OUTPUT"
      - id: key
        run: echo "key=$(git ls-files -s -- . ':!docs' ':!.claude' ':!*.md' | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - id: api
        uses: actions/cache/restore@v6
        with:
          path: .ci-passed
          key: store-api-passed-${{ steps.key.outputs.key }}
          lookup-only: true
      - id: browser
        uses: actions/cache/restore@v6
        with:
          path: .ci-passed
          key: store-browser-passed-${{ steps.key.outputs.key }}
          lookup-only: true
  # Two jobs side by side; inside each, the suite's groups run in parallel with their own stores (API: accounts,
  # payments; browser: flows, layout, features). Two machines instead of one per group: the repository's CI minutes are
  # limited, and each machine repeats the setup. The job named `store` keeps its name for anything that requires it.
  store:
    needs: changes
    if: needs.changes.outputs.store == 'true' && needs.changes.outputs.api_passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: API security tests
        run: npm run test:api
      - name: Passed on these files (a marker, so the same files aren't tested again)
        run: mkdir -p .ci-passed && echo "${{ github.sha }}" > .ci-passed/sha
      - uses: actions/cache/save@v6
        with:
          path: .ci-passed
          key: store-api-passed-${{ needs.changes.outputs.key }}
  store-browser:
    needs: changes
    if: needs.changes.outputs.store == 'true' && needs.changes.outputs.browser_passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright
        id: pw
        run: npm install -g playwright@1 && echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Chromium is kept between runs per Playwright version; the system libraries it needs are still installed each time.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}-${{ runner.os }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and chaos tests
        run: npm run test:browser
      - name: Passed on these files (a marker, so the same files aren't tested again)
        run: mkdir -p .ci-passed && echo "${{ github.sha }}" > .ci-passed/sha
      - uses: actions/cache/save@v6
        with:
          path: .ci-passed
          key: store-browser-passed-${{ needs.changes.outputs.key }}
