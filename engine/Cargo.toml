# AutoStacc processing engine: one Rust crate, built natively for the server Container and as WebAssembly for the
# Pack Builder's Web Workers (docs/engine.md). Modules: hash, zipread, formats, facts, job; results are JSON (contract v1).
[package]
name = "autostacc-engine"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "autostacc-engine"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
miniz_oxide = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Native only (the server Container's HTTP front and its R2 access); never in the WebAssembly build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls"] }
rusty-s3 = "0.7"
